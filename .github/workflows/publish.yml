name: Publish to (Test-)PyPI

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi
  pull_request:
  push:
    branches: [dev, master]

jobs:
  build:
    name: Build ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pkg: [jetson-cli, jetson-containers]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Compute release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          event = os.environ["EVENT_NAME"]
          ref = os.environ["REF"]
          run_num = os.environ["RUN_NUMBER"]
          pyproject = pathlib.Path("pyproject.toml")
          text = pyproject.read_text()
          base = re.search(r'(?m)^version = "([^"]+)"', text).group(1)
          # Stable only on actual push to master. workflow_dispatch always
          # gets a .devN suffix so a manual run on master cannot accidentally
          # publish a stable wheel.
          if event == "push" and ref == "refs/heads/master":
              version = base
          else:
              version = f"{base}.dev{run_num}"
          print(f"base={base} ref={ref} -> {version}")
          pyproject.write_text(
              re.sub(
                  r'(?m)^version = ".*"',
                  f'version = "{version}"',
                  text,
                  count=1,
              )
          )
          init = pathlib.Path("jetson_cli/__init__.py")
          init.write_text(
              re.sub(
                  r'(?m)^__version__ = ".*"',
                  f'__version__ = "{version}"',
                  init.read_text(),
                  count=1,
              )
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={version}\n")
          PY

      - name: Rewrite pyproject name + readme for ${{ matrix.pkg }}
        env:
          PKG: ${{ matrix.pkg }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          pkg = os.environ["PKG"]
          path = pathlib.Path("pyproject.toml")
          text = path.read_text()
          text = re.sub(r'(?m)^name = ".*"', f'name = "{pkg}"', text, count=1)
          text = re.sub(
              r'(?m)^readme = ".*"',
              f'readme = "packaging/README.{pkg}.md"',
              text,
              count=1,
          )
          path.write_text(text)
          print(f"Rewrote pyproject.toml for {pkg}")
          PY

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify distribution metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist-${{ matrix.pkg }}
          path: dist/

  publish-testpypi:
    name: Publish ${{ matrix.pkg }} to Test-PyPI
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi')
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        pkg: [jetson-cli, jetson-containers]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist-${{ matrix.pkg }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1 (2025-10-24)
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish ${{ matrix.pkg }} to PyPI
    if: >
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        pkg: [jetson-cli, jetson-containers]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist-${{ matrix.pkg }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1 (2025-10-24)
        with:
          skip-existing: true
