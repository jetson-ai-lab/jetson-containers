upstream_sha256 = "4d9de6e67cf694d29f18b2b10bbb3814aa1fe4b0529cb7dedcf57e266df99bcd"
changes = "ported [ ... ] tests to [[ ... ]] (Sonar shelldre:S7688). No behavior change. Upstream cleanup tracked in jetson-ai-lab/jetson-containers#19."
