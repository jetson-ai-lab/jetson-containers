upstream_sha256 = "5d5f822164e322b617aa1146b77d21721db55e1f61fc2d7eb78327c773e4ffdd"
changes = "ported [ ... ] tests to [[ ... ]] (Sonar shelldre:S7688). No behavior change. Upstream cleanup tracked in jetson-ai-lab/jetson-containers#19."
note    = "Required because torch's aarch64 wheels link against libcudss.so.0. Discovered in build #3 via ImportError."

