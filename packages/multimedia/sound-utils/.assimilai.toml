# --- Source 2: torch / torchaudio pip install logic ---
[[sources]]
path    = "packages/ml/pytorch"
version = "HEAD @ 2026-04-13"

[[sources.files]]
from    = "install.sh"
target  = "Dockerfile"
status  = "dissolved"
into    = "RUN uv pip install torch torchaudio"
note    = "lines 53-60 of install.sh; torch 2.10.0 and torchaudio 2.10.0 wheels for cp312 linux_aarch64 verified present at https://pypi.jetson-ai-lab.io/sbsa/cu130/+simple/."

[[sources.files]]
from    = "torchaudio/install.sh"
target  = "Dockerfile"
status  = "dissolved"
into    = "RUN uv pip install torch torchaudio"
note    = "torchaudio >=2.9 delegates .save() to torchcodec, which needs FFmpeg >=7. Ubuntu 24.04 noble ships FFmpeg 6 only, and the jetson-ai-lab mirror only has torchcodec wheels with libtorchcodec_core7.so (FFmpeg 7 ABI). Rather than pull in an out-of-distro FFmpeg 7 backport, test.py was patched to soft-skip the torchaudio.save sub-test (soundfile.write covers the same use case)."
